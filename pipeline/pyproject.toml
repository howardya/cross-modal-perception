[project]
name = "cmp-pipeline"
version = "0.1.0"
description = "Cross-modal perception: persona scoring, divergence metrics, calibration."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
scoring = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
